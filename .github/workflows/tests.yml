name: Tests

on:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/muve_test?schema=public
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/muve_test?schema=public

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: muve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: muve-backend/package-lock.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          cache: true

      - name: Install backend dependencies
        working-directory: muve-backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: muve
        run: flutter pub get

      - name: Run unit tests
        working-directory: muve-backend
        run: npm run test:unit

      - name: Apply test database migrations
        working-directory: muve-backend
        run: npx prisma migrate deploy

      - name: Run integration tests
        working-directory: muve-backend
        run: npm run test:integration

      - name: Run system tests
        working-directory: muve
        run: flutter test test/system
